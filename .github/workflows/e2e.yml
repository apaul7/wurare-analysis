# Full suite including the docker e2e tier (real biocontainer pulls, minutes
# per test). Manual trigger only -- run it from the Actions tab or
# `gh workflow run e2e.yml`. test_talos_load always skips (yellow warning):
# it needs a hand-built talos:11.1.0 image that CI cannot produce.
name: e2e

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NXF_SYNTAX_PARSER: v2
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Run full test suite
        run: ./tests/run.sh
